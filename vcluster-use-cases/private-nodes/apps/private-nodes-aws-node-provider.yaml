apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: private-nodes-aws-node-provider
  namespace: argocd
  labels:
    use-case.demos.vcluster.com: private-nodes-aws
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/loft-demos/lambda-demo-app'
    targetRevision: 'main'
    path: vcluster-use-cases/private-nodes/auto-nodes/aws-manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: vcluster-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
