apiVersion: management.loft.sh/v1
kind: NodeProvider
metadata:
  name: private-nodes-aws-node-provider
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  displayName: Private Nodes AWS Node Provider
  properties:
    region: us-east-1
    vcluster.com/ccm-enabled: 'true'
  terraform:
    nodeTemplate:
      git:
        repository: https://github.com/loft-sh/vcluster-auto-nodes-aws.git
        tag: v0.1.1
        subPath: node
    nodeEnvironmentTemplate:
      infrastructure:
        git:
          repository: https://github.com/loft-sh/vcluster-auto-nodes-aws.git
          tag: v0.1.1
          subPath: environment/infrastructure
      kubernetes:
        git:
          repository: https://github.com/loft-sh/vcluster-auto-nodes-aws.git
          tag: v0.1.1
          subPath: environment/kubernetes
    nodeTypes:
      - name: t3.small
        properties:
          instance-type: t3.small
          terraform.vcluster.com/credentials: '*'
        resources:
          cpu: '2'
          memory: 2Gi
        metadata: {}
      - name: t3.medium
        properties:
          instance-type: t3.medium
          terraform.vcluster.com/credentials: '*'
        resources:
          cpu: '2'
          memory: 4Gi
        metadata: {}
      - name: t3.large
        properties:
          instance-type: t3.large
          terraform.vcluster.com/credentials: '*'
        resources:
          cpu: '2'
          memory: 8Gi
        metadata: {}
      - name: t3.xlarge
        properties:
          instance-type: t3.xlarge
          terraform.vcluster.com/credentials: '*'
        resources:
          cpu: '4'
          memory: 16Gi
        metadata: {}
      - name: t3.2xlarge
        properties:
          instance-type: t3.2xlarge
          terraform.vcluster.com/credentials: '*'
        resources:
          cpu: '8'
          memory: 32Gi
        metadata: {}
